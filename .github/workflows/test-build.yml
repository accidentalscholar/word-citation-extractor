name: Test Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.14.6
      uses: actions/setup-python@v5
      with:
        python-version: '3.14.6'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller python-docx pandas requests xlsxwriter

    - name: Build executable
      run: pyinstaller --onefile --hidden-import=xlsxwriter word-citation-extractor.py

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-build-${{ matrix.os }}
        path: dist/*